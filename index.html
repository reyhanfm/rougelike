<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Pedang Jiwa — roguelike platformer retro. Gugur, upgrade stat, coba lagi." />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="data:," />
    <title>Pedang Jiwa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=block" rel="stylesheet" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        background: #000;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      canvas {
        image-rendering: pixelated;
      }
      /* Mobile: no scroll, zoom, text selection or long-press menu while playing. */
      html,
      body {
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      .touch-device {
        --pad: clamp(44px, 12vw, 56px);
        --action: clamp(44px, 13vw, 60px);
        --edge: 12px;
        height: 100dvh;
      }
      .touch-device #app {
        position: absolute;
        top: calc(56px + env(safe-area-inset-top));
        left: env(safe-area-inset-left);
        width: calc(100% - env(safe-area-inset-left) - env(safe-area-inset-right));
        height: calc(100% - 56px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      }
      .touch-playing #app {
        height: calc(100% - 244px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      }
      #touch {
        position: fixed;
        inset: 0;
        z-index: 10;
        pointer-events: none;
        font-family: 'Press Start 2P', monospace;
      }
      #touch .t-top,
      #touch .t-pad,
      #touch .t-acts {
        position: absolute;
        display: grid;
        gap: 8px;
      }
      #touch button {
        pointer-events: auto;
        min-height: 44px;
        font: inherit;
        font-size: 8px;
        color: #fff1e8;
        background: #1d2b53;
        border: 2px solid #83769c;
        border-radius: 14px;
        padding: 0;
        touch-action: none;
      }
      #touch button.on {
        background: #665b16;
        border-color: #ffec27;
        transform: translateY(2px);
      }
      #touch button:focus-visible {
        outline: 3px solid #ffec27;
      }
      #touch .t-top {
        top: max(6px, env(safe-area-inset-top));
        right: max(12px, env(safe-area-inset-right));
        grid-auto-flow: column;
      }
      #touch .t-top button {
        padding: 0 12px;
      }
      #touch.menu .t-pad,
      #touch.menu .t-acts,
      #touch.menu .t-hint,
      #touch:not(.in-run) [data-key='ESC'],
      #touch:not(.paused) [data-key='Q'] {
        display: none;
      }
      #touch .t-pad {
        left: max(var(--edge), env(safe-area-inset-left));
        bottom: calc(40px + env(safe-area-inset-bottom));
        grid-template-columns: repeat(2, var(--pad));
        grid-template-rows: var(--pad) 44px;
      }
      #touch .left,
      #touch .right {
        font-size: 22px;
      }
      #touch .down {
        grid-column: 1 / 3;
      }
      #touch .t-acts {
        right: max(var(--edge), env(safe-area-inset-right));
        bottom: calc(40px + env(safe-area-inset-bottom));
        grid-template-columns: repeat(3, var(--action));
        grid-template-rows: 48px var(--action);
      }
      #touch .skill {
        grid-area: 1 / 2;
      }
      #touch .ult {
        grid-area: 1 / 3;
      }
      #touch .dash {
        grid-area: 2 / 1;
      }
      #touch .atk {
        grid-area: 2 / 2;
        border-color: #ff004d;
      }
      #touch .jump {
        grid-area: 2 / 3;
        border-color: #29adff;
      }
      #touch .t-hint {
        position: absolute;
        bottom: calc(8px + env(safe-area-inset-bottom));
        width: 100%;
        margin: 0;
        color: #c2c3c7;
        font:
          12px system-ui,
          sans-serif;
        text-align: center;
      }
      @media (orientation: landscape) {
        .touch-device {
          --pad: 52px;
          --action: 52px;
        }
        .touch-playing #app {
          left: calc(132px + env(safe-area-inset-left));
          width: calc(100% - 324px - env(safe-area-inset-left) - env(safe-area-inset-right));
          height: calc(100% - 56px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Game ini membutuhkan JavaScript untuk berjalan.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
